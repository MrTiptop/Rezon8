# MrTiptop

[http]
doc_root = /usr/share/snapserver/snapweb

[stream]
# Real stream-source binaries are installed in the test image from
# stream-sources.versions.json (see scripts/install_stream_sources.sh).
source = airplay:///shairport-sync?name=AirPlay&devicename=Rezon8
source = pipe:///tmp/snapfifo?name=Mopidy
# DJ Controller: TCP listen (S16LE 48000 stereo on 4953) — dj_live_streamer Snapcast output.
source = tcp://0.0.0.0:4953?name=DJ Controller&sampleformat=48000:16:2&mode=server
source = librespot:///librespot?name=Spotify&devicename=Rezon8
source = pipe:///tmp/dummy_fifo?name=Dummy Source

[logging]
filter = *:info
