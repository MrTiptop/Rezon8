name: Update stream source versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update tracked versions
        run: python3 scripts/update_stream_sources_versions.py

      - name: Read version pins for Docker build args
        run: |
          LIBRESPOT_VERSION="$(python3 -c "import json;print(json.load(open('docker/snapcast-test/stream-sources.versions.json'))['librespot'])")"
          SHAIRPORT_SYNC_VERSION="$(python3 -c "import json;print(json.load(open('docker/snapcast-test/stream-sources.versions.json'))['shairport-sync'])")"
          echo "LIBRESPOT_VERSION=${LIBRESPOT_VERSION}" >> "${GITHUB_ENV}"
          echo "SHAIRPORT_SYNC_VERSION=${SHAIRPORT_SYNC_VERSION}" >> "${GITHUB_ENV}"

      - name: Build Docker image with pinned source args
        run: |
          docker build -f docker/snapcast-test/Dockerfile \
            --build-arg LIBRESPOT_VERSION="${LIBRESPOT_VERSION}" \
            --build-arg SHAIRPORT_SYNC_VERSION="${SHAIRPORT_SYNC_VERSION}" \
            --tag rezon8-snapserver:stream-sources-check .

      - name: Show embedded stream source labels
        run: |
          docker inspect rezon8-snapserver:stream-sources-check --format '{{ index .Config.Labels "org.rezon8.stream_source.librespot" }}'
          docker inspect rezon8-snapserver:stream-sources-check --format '{{ index .Config.Labels "org.rezon8.stream_source.shairport_sync" }}'

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh stream source versions"
          title: "chore: refresh stream source versions"
          body: |
            ## Summary
            - refreshes tracked upstream versions for `librespot` and `shairport-sync`
            - updates `docker/snapcast-test/stream-sources.versions.json`

            ## Why
            - keeps stream source dependencies visible and current in the repo
          branch: "chore/update-stream-sources"
          delete-branch: true
