# MrTiptop
# Pass pins from stream-sources.versions.json, e.g.:
#   export LIBRESPOT_VERSION=$(python3 -c "import json;print(json.load(open('docker/snapcast-test/stream-sources.versions.json'))['librespot'])")
#   export SHAIRPORT_SYNC_VERSION=$(python3 -c "import json;print(json.load(open('docker/snapcast-test/stream-sources.versions.json'))['shairport-sync'])")
#   docker compose -f docker-compose.snapcast-test.yml up -d --build

services:
  snapserver:
    build:
      context: .
      dockerfile: docker/snapcast-test/Dockerfile
      args:
        LIBRESPOT_VERSION: ${LIBRESPOT_VERSION:-v0.8.0}
        SHAIRPORT_SYNC_VERSION: ${SHAIRPORT_SYNC_VERSION:-5.6.3}
    container_name: snapcast-redesign-test
    ports:
      - "1704:1704"
      - "1705:1705"
      - "1780:1780"
    restart: unless-stopped

  snapclient:
    build:
      context: .
      dockerfile: docker/snapcast-test/Dockerfile
      args:
        LIBRESPOT_VERSION: ${LIBRESPOT_VERSION:-v0.8.0}
        SHAIRPORT_SYNC_VERSION: ${SHAIRPORT_SYNC_VERSION:-5.6.3}
    container_name: snapcast-redesign-client
    depends_on:
      - snapserver
    entrypoint:
      - /usr/bin/snapclient
    command:
      - --host
      - snapserver
      - --port
      - "1704"
      - --hostID
      - docker-dummy-client
      - --player
      - file
      - --logsink=stdout
      - --logfilter=*:info
    restart: unless-stopped

  snapclient2:
    build:
      context: .
      dockerfile: docker/snapcast-test/Dockerfile
      args:
        LIBRESPOT_VERSION: ${LIBRESPOT_VERSION:-v0.8.0}
        SHAIRPORT_SYNC_VERSION: ${SHAIRPORT_SYNC_VERSION:-5.6.3}
    container_name: snapcast-redesign-client-2
    depends_on:
      - snapserver
    entrypoint:
      - /usr/bin/snapclient
    command:
      - --host
      - snapserver
      - --port
      - "1704"
      - --hostID
      - docker-dummy-client-2
      - --player
      - file
      - --logsink=stdout
      - --logfilter=*:info
    restart: unless-stopped
